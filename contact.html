```html
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kontakt | Lukas Business</title>

  <!-- Bebas Neue -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

  <style>

    /* =========================
       GRUNDLAYOUT
    ========================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;

      background-image: url("backgroundimage.png");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;

      min-height: 100vh;

      color: white;
    }


    /* =========================
       NAVIGATION
    ========================= */

    nav {
      position: sticky;
      top: 0;
      z-index: 1000;

      width: 100%;
      height: 52px;

      background-color: rgba(0, 0, 0, 0.75);

      padding: 0 30px;

      display: flex;
      align-items: center;

      backdrop-filter: blur(8px);
    }


    nav ul {
      list-style: none;

      display: flex;
      justify-content: center;
      align-items: center;

      gap: 35px;

      width: 100%;

      margin: 0;
      padding: 0;
    }


    /* =========================
       MENÜPUNKTE
    ========================= */

    nav a {
      font-family: "Bebas Neue", sans-serif;

      text-decoration: none;

      color: white;

      font-size: 22px;
      line-height: 1;

      letter-spacing: 1px;

      transition: 0.3s ease;
    }


    nav a:hover {
      color: #00d9ff;
    }


    /* Aktive Seite */

    nav a.active {
      color: #00d9ff;
    }


    /* =========================
       LOGO
    ========================= */

    .logo {
      position: absolute;

      top: 0;
      left: 0;

      width: 125px;
      height: 52px;

      object-fit: contain;
      object-position: left top;

      display: block;
    }


    /* =========================
       KONTAKTBEREICH
    ========================= */

    .kontakt {
      max-width: 1100px;

      margin: 0 auto;

      padding: 100px 25px 80px;
    }


    /* =========================
       ÜBERSCHRIFT
    ========================= */

    .kontakt-header {
      text-align: center;

      margin-bottom: 55px;
    }

```
