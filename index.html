<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meine Website</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-image: url("backgroundimage.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
    }

    /* Navigation */
    nav {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 15px;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
    }

    nav a {
      text-decoration: none;
      color: white;
      font-weight: bold;
      transition: 0.2s;
    }

    nav a:hover {
      color: #00d9ff;
    }

    /* Logo */
    .logo {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 150px;
      height: auto;
    }

    /* Inhalt */
    header {
      text-align: center;
      color: white;
      margin-top: 200px;
    }

    header h1 {
      font-size: 48px;
    }

    /* Mobile */
    @media (max-width: 600px) {
      nav ul {
        flex-direction: column;
        gap: 10px;
      }

      header {
        margin-top: 100px;
        padding: 20px;
      }

      header h1 {
        font-size: 32px;
      }

      .logo {
        width: 100px;
      }
    }
  </style>
</head>

<body>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">Über mich</a></li>
      <li><a href="services.html">Leistungen</a></li>
      <li><a href="contact.html">Kontakt</a></li>
    </ul>
  </nav>

  <img
    src="logoone.png"
    alt="Lukas Business"
    class="logo"
  >

  <header>
    <h1>Willkommen auf meiner Website</h1>
    <p>Das ist mein erstes Design 😊</p>
  </header>

</body>
</html>
